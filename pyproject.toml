[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wireless-analyzer"
version = "0.1.0"
description = "Kali Linux-First Passive Wireless Signal Observation and Environmental Analysis Platform"
readme = "README.md"
authors = [{ name = "Wireless Analyzer Contributors" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "jinja2>=3.1.3",
    "pyyaml>=6.0.1",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
ble = [
    "bleak>=0.21.1",
]
scapy = [
    "scapy>=2.5.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "httpx>=0.27.0",
]
all = [
    "bleak>=0.21.1",
    "scapy>=2.5.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "httpx>=0.27.0",
]

[project.scripts]
wireless-analyzer = "application.cli:main"
signal-observer = "application.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
application = ["web/templates/*", "web/static/**/*", "config/*.yaml", "data/**/*"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --asyncio-mode=auto"
testpaths = ["tests"]
pythonpath = ["src"]
